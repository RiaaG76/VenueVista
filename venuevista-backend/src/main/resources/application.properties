# ===================================================================
# VenueVista Backend Configuration
# ===================================================================

# Application Information
spring.application.name=venuevista-backend
server.port=8080

# -------------------------------------------------------------------
# Datasource Configuration (MySQL)
# Configured via environment variables with developer local fallbacks.
# Note: Ensure MySQL is running and the database exists before launch.
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/venuevista_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.com.venuevista=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

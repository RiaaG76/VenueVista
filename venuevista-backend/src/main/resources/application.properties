# ===================================================================
# VenueVista Backend Configuration
# ===================================================================

# Application Information
spring.application.name=venuevista-backend
server.port=${PORT:${SERVER_PORT:8081}}

# -------------------------------------------------------------------
# Datasource Configuration (MySQL)
# Configured via environment variables with developer local fallbacks.
# Note: Ensure MySQL is running and the database exists before launch.
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/venuevista_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.com.venuevista=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# -------------------------------------------------------------------
# JWT Security Configuration
# Loaded exclusively from environment variable VENUEVISTA_JWT_SECRET.
# No hardcoded or default secret fallback is permitted in production.
# -------------------------------------------------------------------
venuevista.jwt.secret=${VENUEVISTA_JWT_SECRET:}
venuevista.jwt.expiration-ms=${VENUEVISTA_JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# Dual OTP Verification Configuration
# Demo mode enabled by default for local development and academic evaluation.
# In demo mode, generated OTPs are returned in development responses.
# In production, demo mode is disabled and OTPs are delivered via external channels.
# -------------------------------------------------------------------
venuevista.otp.demo-mode=${VENUEVISTA_OTP_DEMO_MODE:true}
venuevista.otp.expiry-seconds=${VENUEVISTA_OTP_EXPIRY_SECONDS:300}
venuevista.otp.cooldown-seconds=${VENUEVISTA_OTP_COOLDOWN_SECONDS:30}
venuevista.otp.max-attempts=${VENUEVISTA_OTP_MAX_ATTEMPTS:5}


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStadium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="40%" stop-color="#14213d" />
      <stop offset="70%" stop-color="#1f335e" />
      <stop offset="100%" stop-color="#0e1a33" />
    </linearGradient>
    <linearGradient id="badmintonCourt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <radialGradient id="stadiumFloodlight" cx="50%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shuttleTail" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="motionTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Arena Atmosphere -->
  <rect width="600" height="360" fill="url(#bgStadium)" />
  <rect width="600" height="360" fill="url(#stadiumFloodlight)" />

  <!-- Overhead Stadium Floodlight Banks -->
  <g fill="#f8fafc" opacity="0.95">
    <!-- Left Light Bank -->
    <rect x="60" y="15" width="90" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="75" cy="27" r="5" fill="#fef08a" />
    <circle cx="95" cy="27" r="5" fill="#fef08a" />
    <circle cx="115" cy="27" r="5" fill="#fef08a" />
    <circle cx="135" cy="27" r="5" fill="#fef08a" />
    <!-- Right Light Bank -->
    <rect x="450" y="15" width="90" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="465" cy="27" r="5" fill="#fef08a" />
    <circle cx="485" cy="27" r="5" fill="#fef08a" />
    <circle cx="505" cy="27" r="5" fill="#fef08a" />
    <circle cx="525" cy="27" r="5" fill="#fef08a" />
  </g>

  <!-- Angled Stadium Light Beams -->
  <polygon points="105,39 0,220 280,220" fill="#fef08a" opacity="0.1" />
  <polygon points="495,39 320,220 600,220" fill="#fef08a" opacity="0.1" />

  <!-- Professional Badminton Court Mat (Perspective Polygon) -->
  <polygon points="60,150 540,150 600,360 0,360" fill="url(#badmintonCourt)" stroke="#10b981" stroke-width="1.5" />

  <!-- White Court Boundary Markings (Perspective) -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.9">
    <!-- Outer baseline near foreground -->
    <line x1="25" y1="340" x2="575" y2="340" stroke-width="3" />
    <!-- Center service line -->
    <line x1="300" y1="150" x2="300" y2="340" stroke-width="2" />
    <!-- Doubles sideline left & right -->
    <line x1="60" y1="150" x2="25" y2="340" />
    <line x1="540" y1="150" x2="575" y2="340" />
    <!-- Singles sideline left & right -->
    <line x1="100" y1="150" x2="75" y2="340" stroke-dasharray="8,4" />
    <line x1="500" y1="150" x2="525" y2="340" stroke-dasharray="8,4" />
    <!-- Short service line -->
    <line x1="85" y1="210" x2="515" y2="210" />
  </g>

  <!-- Regulation Badminton Net in Midground -->
  <!-- Net Posts -->
  <line x1="50" y1="130" x2="50" y2="175" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round" />
  <line x1="550" y1="130" x2="550" y2="175" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round" />
  <!-- White Net Tape Top -->
  <line x1="50" y1="140" x2="550" y2="140" stroke="#ffffff" stroke-width="3" />
  <!-- Net Mesh (Dark Crosshatch) -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.35">
    <line x1="50" y1="147" x2="550" y2="147" />
    <line x1="50" y1="154" x2="550" y2="154" />
    <line x1="50" y1="161" x2="550" y2="161" />
    <!-- Vertical net cord lines -->
    <path d="M70,140 L70,165 M100,140 L100,165 M130,140 L130,165 M160,140 L160,165 M190,140 L190,165 M220,140 L220,165 M250,140 L250,165 M280,140 L280,165 M310,140 L310,165 M340,140 L340,165 M370,140 L370,165 M400,140 L400,165 M430,140 L430,165 M460,140 L460,165 M490,140 L490,165 M520,140 L520,165" />
  </g>

  <!-- Dynamic Motion Trail Behind Smashing Shuttlecock -->
  <path d="M80,80 Q200,140 340,170" fill="none" stroke="url(#motionTrail)" stroke-width="6" stroke-linecap="round" opacity="0.85" />
  <path d="M110,85 Q220,145 340,170" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.9" />

  <!-- Close-Up Realistic Shuttlecock in Flight -->
  <g transform="translate(340, 165) rotate(22)">
    <!-- Cork Base (Rounded Front) -->
    <ellipse cx="25" cy="0" rx="9" ry="8" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="18" y="-7" width="5" height="14" fill="#ef4444" /> <!-- Red stripe band -->
    
    <!-- Feather Skirt Cone (16 Aerodynamic Feathers) -->
    <polygon points="18,-8 -35,-26 -35,26 18,8" fill="url(#shuttleTail)" stroke="#94a3b8" stroke-width="1" />
    <!-- Feather Spine Ridges -->
    <g stroke="#ffffff" stroke-width="1.5">
      <line x1="16" y1="-7" x2="-35" y2="-24" />
      <line x1="16" y1="-4" x2="-35" y2="-15" />
      <line x1="16" y1="-1" x2="-35" y2="-6" />
      <line x1="16" y1="2" x2="-35" y2="4" />
      <line x1="16" y1="5" x2="-35" y2="14" />
      <line x1="16" y1="7" x2="-35" y2="24" />
    </g>
    <!-- Overlapping Thread Binding Lines -->
    <ellipse cx="-10" cy="0" rx="4" ry="14" fill="none" stroke="#64748b" stroke-width="1.5" />
    <ellipse cx="-22" cy="0" rx="5" ry="19" fill="none" stroke="#64748b" stroke-width="1.5" />
  </g>

  <!-- Crossed Tournament Pro Badminton Rackets in Foreground Right -->
  <g transform="translate(430, 180) rotate(-32)">
    <!-- Racket 1 Shaft & Handle -->
    <rect x="0" y="80" width="8" height="120" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Grip Tape Spiral -->
    <g stroke="#f59e0b" stroke-width="2">
      <line x1="0" y1="140" x2="8" y2="145" />
      <line x1="0" y1="155" x2="8" y2="160" />
      <line x1="0" y1="170" x2="8" y2="175" />
      <line x1="0" y1="185" x2="8" y2="190" />
    </g>
    <!-- Slim Carbon Shaft -->
    <rect x="2" y="30" width="4" height="60" fill="#38bdf8" />
    <!-- Isometric Head Frame -->
    <ellipse cx="4" cy="0" rx="38" ry="46" fill="none" stroke="#38bdf8" stroke-width="4" />
    <!-- String Mesh -->
    <g stroke="rgba(255,255,255,0.4)" stroke-width="0.8">
      <line x1="-22" y1="-30" x2="-22" y2="30" />
      <line x1="-10" y1="-42" x2="-10" y2="42" />
      <line x1="4" y1="-46" x2="4" y2="46" stroke-width="1.2" stroke="#f43f5e" />
      <line x1="18" y1="-42" x2="18" y2="42" />
      <line x1="30" y1="-30" x2="30" y2="30" />
      <line x1="-30" y1="-20" x2="38" y2="-20" />
      <line x1="-36" y1="-5" x2="44" y2="-5" />
      <line x1="-36" y1="10" x2="44" y2="10" />
      <line x1="-30" y1="25" x2="38" y2="25" />
    </g>
  </g>

  <!-- Arena Trophy & Winner Laurel Accent in Foreground Left -->
  <g transform="translate(60, 240)">
    <polygon points="25,50 45,50 40,75 30,75" fill="#d97706" />
    <rect x="20" y="75" width="30" height="10" rx="2" fill="#78350f" />
    <!-- Cup Body -->
    <path d="M15,15 Q35,15 35,42 Q35,52 25,52 Q15,52 15,42 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" />
    <!-- Handles -->
    <path d="M15,20 C5,20 5,35 15,38" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <path d="M35,20 C45,20 45,35 35,38" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="25" cy="30" r="14" fill="#fef08a" opacity="0.3" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b1a" />
      <stop offset="40%" stop-color="#0a1633" />
      <stop offset="80%" stop-color="#0f224f" />
      <stop offset="100%" stop-color="#060e22" />
    </linearGradient>
    <linearGradient id="glowNeural" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="screenBloom" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050b1a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="isoCube1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="isoCube2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Deep Tech Cyber Environment -->
  <rect width="600" height="360" fill="url(#bgTech)" />
  <rect width="600" height="360" fill="url(#screenBloom)" />

  <!-- Perspective Floor Grid (Matrix / Virtual Stage) -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1">
    <!-- Perspective lines originating from center horizon (300, 160) -->
    <line x1="300" y1="160" x2="-100" y2="360" />
    <line x1="300" y1="160" x2="30" y2="360" />
    <line x1="300" y1="160" x2="160" y2="360" />
    <line x1="300" y1="160" x2="300" y2="360" stroke-width="1.5" />
    <line x1="300" y1="160" x2="440" y2="360" />
    <line x1="300" y1="160" x2="570" y2="360" />
    <line x1="300" y1="160" x2="700" y2="360" />
    <!-- Horizontal depth lines -->
    <line x1="180" y1="200" x2="420" y2="200" />
    <line x1="120" y1="235" x2="480" y2="235" />
    <line x1="50" y1="280" x2="550" y2="280" />
    <line x1="-50" y1="335" x2="650" y2="335" />
  </g>

  <!-- Widescreen Keynote Display Backdrop -->
  <rect x="70" y="35" width="460" height="180" rx="12" fill="#07132c" stroke="#1e3a70" stroke-width="2" />
  <rect x="76" y="41" width="448" height="168" rx="8" fill="#0a193b" opacity="0.8" />

  <!-- Code / Terminal Header Bar on Screen -->
  <rect x="76" y="41" width="448" height="24" rx="6" fill="#0f2554" />
  <circle cx="95" cy="53" r="4" fill="#ef4444" />
  <circle cx="110" cy="53" r="4" fill="#f59e0b" />
  <circle cx="125" cy="53" r="4" fill="#10b981" />
  <text x="300" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="600">ai-cloud-cluster.orchestration.k8s // LIVE SUMMIT</text>

  <!-- Neural Network Synapse Architecture in Center Screen -->
  <g opacity="0.9">
    <!-- Connecting Synaptic Pulses -->
    <g stroke="url(#glowNeural)" stroke-width="2" stroke-linecap="round">
      <!-- Input layer to hidden layer 1 -->
      <line x1="140" y1="90" x2="210" y2="80" />
      <line x1="140" y1="90" x2="210" y2="125" />
      <line x1="140" y1="145" x2="210" y2="80" />
      <line x1="140" y1="145" x2="210" y2="125" />
      <line x1="140" y1="145" x2="210" y2="165" />
      
      <!-- Hidden layer 1 to Hidden layer 2 -->
      <line x1="210" y1="80" x2="300" y2="70" />
      <line x1="210" y1="80" x2="300" y2="115" />
      <line x1="210" y1="125" x2="300" y2="115" />
      <line x1="210" y1="125" x2="300" y2="160" />
      <line x1="210" y1="165" x2="300" y2="160" />

      <!-- Hidden 2 to Cloud Hub (390) -->
      <line x1="300" y1="70" x2="390" y2="90" />
      <line x1="300" y1="115" x2="390" y2="90" />
      <line x1="300" y1="115" x2="390" y2="140" />
      <line x1="300" y1="160" x2="390" y2="140" />

      <!-- Hub to Output Nodes (460) -->
      <line x1="390" y1="90" x2="460" y2="80" />
      <line x1="390" y1="90" x2="460" y2="120" />
      <line x1="390" y1="140" x2="460" y2="120" />
      <line x1="390" y1="140" x2="460" y2="160" />
    </g>

    <!-- Synapse Nodes (Glowing Circles) -->
    <!-- Input Nodes -->
    <circle cx="140" cy="90" r="7" fill="#38bdf8" />
    <circle cx="140" cy="90" r="14" fill="#38bdf8" opacity="0.25" />
    <circle cx="140" cy="145" r="7" fill="#38bdf8" />
    <circle cx="140" cy="145" r="14" fill="#38bdf8" opacity="0.25" />

    <!-- Hidden Nodes 1 -->
    <circle cx="210" cy="80" r="8" fill="#60a5fa" />
    <circle cx="210" cy="125" r="9" fill="#818cf8" />
    <circle cx="210" cy="165" r="8" fill="#60a5fa" />

    <!-- Central Neural Core Node -->
    <circle cx="300" cy="115" r="16" fill="#6366f1" />
    <circle cx="300" cy="115" r="26" fill="#818cf8" opacity="0.3" />
    <circle cx="300" cy="115" r="6" fill="#ffffff" />
    <circle cx="300" cy="70" r="8" fill="#a855f7" />
    <circle cx="300" cy="160" r="8" fill="#a855f7" />

    <!-- Cloud Gateway Cluster -->
    <circle cx="390" cy="90" r="9" fill="#c084fc" />
    <circle cx="390" cy="140" r="9" fill="#c084fc" />

    <!-- Output Nodes -->
    <circle cx="460" cy="80" r="7" fill="#f472b6" />
    <circle cx="460" cy="120" r="7" fill="#38bdf8" />
    <circle cx="460" cy="160" r="7" fill="#34d399" />
  </g>

  <!-- Isometric Cloud Computing Blocks (Bottom Left & Right Foreground) -->
  <!-- Left Cloud Storage Stack -->
  <g transform="translate(60, 240)">
    <!-- Top Cube -->
    <polygon points="40,10 70,25 40,40 10,25" fill="#38bdf8" />
    <polygon points="10,25 40,40 40,65 10,50" fill="#0284c7" />
    <polygon points="70,25 40,40 40,65 70,50" fill="#0369a1" />
    <!-- Floating Server Rings -->
    <ellipse cx="40" cy="75" rx="36" ry="10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,4" />
    <ellipse cx="40" cy="85" rx="36" ry="10" fill="none" stroke="#6366f1" stroke-width="1.5" />
  </g>

  <!-- Right Floating Data Pod -->
  <g transform="translate(450, 235)">
    <polygon points="50,10 85,28 50,45 15,28" fill="#818cf8" />
    <polygon points="15,28 50,45 50,75 15,58" fill="#4f46e5" />
    <polygon points="85,28 50,45 50,75 85,58" fill="#3730a3" />
    <ellipse cx="50" cy="85" rx="42" ry="12" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="10,5" />
  </g>

  <!-- Glowing Circuit Traces Across Horizon -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M0,230 L110,230 L130,250 L220,250" />
    <circle cx="220" cy="250" r="3" fill="#38bdf8" />
    <path d="M600,230 L490,230 L470,250 L380,250" />
    <circle cx="380" cy="250" r="3" fill="#818cf8" />
  </g>

  <!-- Center Stage Presenter Podium Glow -->
  <polygon points="265,300 335,300 355,345 245,345" fill="#0d1b3d" stroke="#38bdf8" stroke-width="2" />
  <rect x="280" y="275" width="40" height="25" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
  <line x1="300" y1="260" x2="300" y2="275" stroke="#94a3b8" stroke-width="2" />
  <ellipse cx="300" cy="258" rx="4" ry="2" fill="#38bdf8" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061817" />
      <stop offset="50%" stop-color="#0c2d28" />
      <stop offset="100%" stop-color="#081e1d" />
    </linearGradient>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b3834" />
      <stop offset="50%" stop-color="#112723" />
      <stop offset="100%" stop-color="#0b1b19" />
    </linearGradient>
    <linearGradient id="tabletScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lampWarmth" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="360" fill="url(#bgStudio)" />
  <circle cx="180" cy="120" r="220" fill="url(#lampWarmth)" />

  <!-- Studio Pegboard / Wireframe Grid on Back Wall -->
  <g opacity="0.15" stroke="#34d399" stroke-width="1.5">
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#34d399" />
    </pattern>
    <rect x="0" y="0" width="600" height="150" fill="url(#dotPattern)" />
  </g>

  <!-- Hanging Design Moodboard Cards on Wall -->
  <g transform="translate(380, 25)">
    <!-- Sticky Notes & Palette Swatch pinned to wall -->
    <rect x="0" y="0" width="65" height="55" rx="3" fill="#fef08a" transform="rotate(-4)" />
    <text x="32" y="32" font-family="-apple-system, sans-serif" font-size="9" fill="#854d0e" font-weight="700" text-anchor="middle">DESIGN</text>
    <text x="32" y="44" font-family="-apple-system, sans-serif" font-size="8" fill="#a16207" text-anchor="middle">SPRINT '26</text>
    
    <rect x="80" y="10" width="70" height="60" rx="3" fill="#67e8f9" transform="rotate(6)" />
    <line x1="88" y1="26" x2="138" y2="26" stroke="#0e7490" stroke-width="2" />
    <line x1="88" y1="36" x2="130" y2="36" stroke="#0e7490" stroke-width="2" />
    <circle cx="132" cy="52" r="6" fill="#0891b2" />

    <rect x="165" y="5" width="45" height="70" rx="3" fill="#fda4af" transform="rotate(-2)" />
    <rect x="170" y="15" width="35" height="15" fill="#e11d48" rx="2" />
    <rect x="170" y="35" width="35" height="15" fill="#f43f5e" rx="2" />
    <rect x="170" y="55" width="35" height="15" fill="#fda4af" rx="2" />
  </g>

  <!-- Wooden Studio Desk Surface (Perspective View) -->
  <polygon points="0,150 600,150 600,360 0,360" fill="url(#deskWood)" stroke="#1a423d" stroke-width="2" />
  <line x1="0" y1="152" x2="600" y2="152" stroke="#2dd4bf" stroke-width="1.5" opacity="0.4" />

  <!-- Architecture Cutting Mat (Dark Teal Grid) -->
  <g transform="translate(70, 165)">
    <rect x="0" y="0" width="460" height="185" rx="8" fill="#092823" stroke="#134e4a" stroke-width="2" />
    <!-- Grid markings on cutting mat -->
    <g stroke="#14b8a6" stroke-width="0.8" opacity="0.3">
      <line x1="40" y1="0" x2="40" y2="185" />
      <line x1="80" y1="0" x2="80" y2="185" />
      <line x1="120" y1="0" x2="120" y2="185" />
      <line x1="160" y1="0" x2="160" y2="185" />
      <line x1="200" y1="0" x2="200" y2="185" />
      <line x1="240" y1="0" x2="240" y2="185" />
      <line x1="280" y1="0" x2="280" y2="185" />
      <line x1="320" y1="0" x2="320" y2="185" />
      <line x1="360" y1="0" x2="360" y2="185" />
      <line x1="400" y1="0" x2="400" y2="185" />
      <line x1="0" y1="35" x2="460" y2="35" />
      <line x1="0" y1="70" x2="460" y2="70" />
      <line x1="0" y1="105" x2="460" y2="105" />
      <line x1="0" y1="140" x2="460" y2="140" />
      <line x1="0" y1="175" x2="460" y2="175" />
    </g>
  </g>

  <!-- Digital Tablet Screen displaying Interactive UI wireframe -->
  <g transform="translate(145, 175)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#0b1322" stroke="#475569" stroke-width="3" />
    <rect x="8" y="8" width="204" height="134" rx="6" fill="url(#tabletScreen)" />
    
    <!-- UI Layout Blocks on Tablet Screen -->
    <rect x="16" y="16" width="188" height="24" rx="4" fill="#10b981" opacity="0.8" />
    <circle cx="28" cy="28" r="5" fill="#ffffff" />
    <rect x="42" y="24" width="70" height="8" rx="2" fill="#ffffff" />
    
    <!-- Hero wireframe block -->
    <rect x="16" y="46" width="120" height="48" rx="4" fill="#334155" />
    <line x1="26" y1="60" x2="90" y2="60" stroke="#94a3b8" stroke-width="3" />
    <line x1="26" y1="72" x2="110" y2="72" stroke="#64748b" stroke-width="2" />
    <rect x="26" y="80" width="36" height="10" rx="3" fill="#10b981" />

    <!-- Vector Bezier Curve & Control Nodes -->
    <path d="M145,85 C145,45 195,50 195,90" fill="none" stroke="#2dd4bf" stroke-width="2.5" />
    <circle cx="145" cy="85" r="3.5" fill="#2dd4bf" />
    <circle cx="195" cy="90" r="3.5" fill="#2dd4bf" />
    <circle cx="170" cy="48" r="3" fill="#f43f5e" />
    <line x1="145" y1="85" x2="170" y2="48" stroke="#f43f5e" stroke-dasharray="2,2" stroke-width="1" />

    <!-- 3 Card Grid wireframes on screen bottom -->
    <rect x="16" y="100" width="56" height="34" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="78" y="100" width="56" height="34" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="140" y="100" width="56" height="34" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Digital Stylus Pen resting beside Tablet -->
  <g transform="translate(378, 185) rotate(24)">
    <rect x="0" y="0" width="8" height="110" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    <polygon points="0,110 8,110 4,124" fill="#1e293b" />
    <circle cx="4" cy="125" r="1.5" fill="#ffffff" />
    <rect x="0" y="15" width="8" height="18" fill="#10b981" />
  </g>

  <!-- Color Swatch Fan (Pantone Style) -->
  <g transform="translate(420, 240)">
    <!-- Swatch Blade 1 -->
    <rect x="0" y="0" width="22" height="70" rx="3" fill="#10b981" stroke="#ffffff" stroke-width="1" transform="rotate(-35)" />
    <!-- Swatch Blade 2 -->
    <rect x="0" y="0" width="22" height="70" rx="3" fill="#06b6d4" stroke="#ffffff" stroke-width="1" transform="rotate(-15)" />
    <!-- Swatch Blade 3 -->
    <rect x="0" y="0" width="22" height="70" rx="3" fill="#6366f1" stroke="#ffffff" stroke-width="1" transform="rotate(5)" />
    <!-- Swatch Blade 4 -->
    <rect x="0" y="0" width="22" height="70" rx="3" fill="#ec4899" stroke="#ffffff" stroke-width="1" transform="rotate(25)" />
    <!-- Swatch Pin Pivot -->
    <circle cx="10" cy="65" r="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
  </g>

  <!-- Metal Metric Ruler on Desk -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="240" height="20" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
    <g stroke="#334155" stroke-width="1">
      <line x1="10" y1="0" x2="10" y2="10" />
      <line x1="30" y1="0" x2="30" y2="6" />
      <line x1="50" y1="0" x2="50" y2="10" />
      <line x1="70" y1="0" x2="70" y2="6" />
      <line x1="90" y1="0" x2="90" y2="10" />
      <line x1="110" y1="0" x2="110" y2="6" />
      <line x1="130" y1="0" x2="130" y2="10" />
      <line x1="150" y1="0" x2="150" y2="6" />
      <line x1="170" y1="0" x2="170" y2="10" />
      <line x1="190" y1="0" x2="190" y2="6" />
      <line x1="210" y1="0" x2="210" y2="10" />
      <line x1="230" y1="0" x2="230" y2="6" />
    </g>
  </g>

  <!-- Ceramic Studio Coffee Mug -->
  <g transform="translate(485, 170)">
    <ellipse cx="25" cy="50" rx="22" ry="7" fill="#0f172a" opacity="0.4" />
    <rect x="6" y="10" width="38" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <ellipse cx="25" cy="10" rx="19" ry="6" fill="#e2e8f0" />
    <ellipse cx="25" cy="10" rx="16" ry="4" fill="#78350f" />
    <!-- Mug Handle -->
    <path d="M44,18 C56,18 56,36 44,38" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>

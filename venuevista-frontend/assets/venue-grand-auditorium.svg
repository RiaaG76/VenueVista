<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="audBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#151e36" />
      <stop offset="100%" stop-color="#0b1021" />
    </linearGradient>
    <radialGradient id="ceilingWarmth" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#audBg)" />
  <rect width="600" height="360" fill="url(#ceilingWarmth)" />

  <!-- Acoustic Architectural Ceiling Ribs -->
  <g stroke="#3b4261" stroke-width="2" fill="none" opacity="0.6">
    <path d="M20,60 Q300,-10 580,60" />
    <path d="M40,90 Q300,20 560,90" />
    <path d="M60,120 Q300,50 540,120" />
    <path d="M80,150 Q300,80 520,150" />
  </g>

  <!-- Proscenium Stage Front -->
  <polygon points="120,170 480,170 540,240 60,240" fill="#291b12" stroke="#78350f" stroke-width="2" />
  <line x1="120" y1="172" x2="480" y2="172" stroke="#f59e0b" stroke-width="2" />

  <!-- Stage Warm Glow -->
  <ellipse cx="300" cy="185" rx="140" ry="25" fill="#fef08a" opacity="0.25" />

  <!-- Tiered Auditorium Seating in Foreground (3 Arched Rows) -->
  <g fill="#1e1b4b" stroke="#312e81" stroke-width="2">
    <!-- Row 1 Far -->
    <path d="M40,260 Q300,225 560,260 L570,275 Q300,240 30,275 Z" fill="#312e81" />
    <!-- Row 2 Mid -->
    <path d="M20,290 Q300,250 580,290 L590,310 Q300,270 10,310 Z" fill="#25225c" />
    <!-- Row 3 Foreground -->
    <path d="M0,325 Q300,285 600,325 L600,360 Q300,320 0,360 Z" fill="#1c1945" />
  </g>

  <!-- Individual Plush Seats Accents -->
  <g fill="#4338ca">
    <ellipse cx="180" cy="270" rx="12" ry="5" />
    <ellipse cx="240" cy="265" rx="12" ry="5" />
    <ellipse cx="300" cy="262" rx="12" ry="5" />
    <ellipse cx="360" cy="265" rx="12" ry="5" />
    <ellipse cx="420" cy="270" rx="12" ry="5" />
    <ellipse cx="140" cy="300" rx="16" ry="6" />
    <ellipse cx="220" cy="295" rx="16" ry="6" />
    <ellipse cx="300" cy="292" rx="16" ry="6" />
    <ellipse cx="380" cy="295" rx="16" ry="6" />
    <ellipse cx="460" cy="300" rx="16" ry="6" />
  </g>

  <!-- Venue Badge Overlay -->
  <rect x="25" y="25" width="130" height="28" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#6366f1" stroke-width="1.5" />
  <text x="90" y="44" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">🏛️ AUDITORIUM</text>
</svg>

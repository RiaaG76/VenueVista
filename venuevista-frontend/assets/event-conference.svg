<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgConclave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080c1e" />
      <stop offset="50%" stop-color="#11183c" />
      <stop offset="100%" stop-color="#090d22" />
    </linearGradient>
    <linearGradient id="curvedScreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="30%" stop-color="#4f46e5" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="podiumSpot" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lecternGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Executive Auditorium Atmosphere -->
  <rect width="600" height="360" fill="url(#bgConclave)" />
  <rect width="600" height="360" fill="url(#podiumSpot)" />

  <!-- Massive Curved Panoramic LED Conference Screen -->
  <path d="M40,40 Q300,15 560,40 L560,190 Q300,210 40,190 Z" fill="url(#curvedScreen)" stroke="#4338ca" stroke-width="2.5" />

  <!-- Screen Content Graphics (Global Leadership Map & Key Metrics) -->
  <g opacity="0.85">
    <!-- Stylized World Map Grid on Screen -->
    <g stroke="rgba(255,255,255,0.18)" stroke-width="1.2" fill="none">
      <ellipse cx="300" cy="115" rx="160" ry="60" />
      <line x1="140" y1="115" x2="460" y2="115" />
      <line x1="300" y1="55" x2="300" y2="175" />
      <path d="M220,70 Q300,115 220,160 M380,70 Q300,115 380,160" />
    </g>

    <!-- Keynote Title Overlay on Screen -->
    <text x="300" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">NATIONAL LEADERSHIP CONCLAVE</text>
    <text x="300" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="1">SUSTAINABILITY • ENERGY • INNOVATION 2026</text>

    <!-- Infographic Analytics Barcharts on Left & Right Screen Wings -->
    <g fill="#38bdf8" opacity="0.7">
      <rect x="75" y="130" width="8" height="25" rx="2" />
      <rect x="88" y="115" width="8" height="40" rx="2" fill="#818cf8" />
      <rect x="101" y="95" width="8" height="60" rx="2" fill="#34d399" />
      
      <rect x="490" y="130" width="8" height="25" rx="2" />
      <rect x="503" y="110" width="8" height="45" rx="2" fill="#818cf8" />
      <rect x="516" y="85" width="8" height="70" rx="2" fill="#f43f5e" />
    </g>
  </g>

  <!-- Hardwood Conference Stage Platform -->
  <polygon points="0,210 600,210 600,360 0,360" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <line x1="0" y1="211" x2="600" y2="211" stroke="#4f46e5" stroke-width="2" />
  
  <!-- Subtle Stage Rim Lights (Warm Amber Footlights) -->
  <g fill="#f59e0b">
    <ellipse cx="60" cy="214" rx="10" ry="2" opacity="0.8" />
    <ellipse cx="140" cy="214" rx="10" ry="2" opacity="0.8" />
    <ellipse cx="220" cy="214" rx="10" ry="2" opacity="0.8" />
    <ellipse cx="380" cy="214" rx="10" ry="2" opacity="0.8" />
    <ellipse cx="460" cy="214" rx="10" ry="2" opacity="0.8" />
    <ellipse cx="540" cy="214" rx="10" ry="2" opacity="0.8" />
  </g>

  <!-- Center Stage Executive Acrylic Lectern / Podium -->
  <g transform="translate(260, 160)">
    <!-- Podium Angled Pillar Body -->
    <polygon points="25,48 55,48 65,150 15,150" fill="url(#lecternGlass)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <line x1="40" y1="48" x2="40" y2="150" stroke="#38bdf8" stroke-width="2" opacity="0.7" />

    <!-- Podium Slanted Top Surface -->
    <polygon points="0,48 80,48 70,36 10,36" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    
    <!-- Presenter Digital Tablet on Lectern Top -->
    <polygon points="22,46 58,46 53,38 27,38" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    
    <!-- Twin Gooseneck Microphones on Lectern -->
    <!-- Mic 1 Left -->
    <path d="M22,36 C18,22 28,14 26,4" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <ellipse cx="26" cy="3" rx="2" ry="3.5" fill="#1e293b" stroke="#cbd5e1" stroke-width="1" />
    <!-- Mic 2 Right -->
    <path d="M58,36 C62,22 52,14 54,4" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <ellipse cx="54" cy="3" rx="2" ry="3.5" fill="#1e293b" stroke="#cbd5e1" stroke-width="1" />

    <!-- Center Stage Logo Plaque on Lectern Front -->
    <circle cx="40" cy="85" r="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="40" y="89" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" fill="#38bdf8" text-anchor="middle">VV</text>
  </g>

  <!-- Stage Executive Seating / Panel Armchairs (Left & Right) -->
  <g transform="translate(100, 215)">
    <!-- Left Leather Armchair -->
    <rect x="0" y="20" width="46" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="-6" y="28" width="8" height="24" rx="3" fill="#334155" />
    <rect x="44" y="28" width="8" height="24" rx="3" fill="#334155" />
    <line x1="5" y1="56" x2="5" y2="72" stroke="#94a3b8" stroke-width="2" />
    <line x1="41" y1="56" x2="41" y2="72" stroke="#94a3b8" stroke-width="2" />
  </g>

  <g transform="translate(454, 215)">
    <!-- Right Leather Armchair -->
    <rect x="0" y="20" width="46" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="-6" y="28" width="8" height="24" rx="3" fill="#334155" />
    <rect x="44" y="28" width="8" height="24" rx="3" fill="#334155" />
    <line x1="5" y1="56" x2="5" y2="72" stroke="#94a3b8" stroke-width="2" />
    <line x1="41" y1="56" x2="41" y2="72" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- Audience Silhouettes Foreground -->
  <path d="M0,360 L0,320 Q60,305 120,325 Q180,310 240,325 Q300,305 360,325 Q420,310 480,325 Q540,305 600,320 L600,360 Z" fill="#050814" />
</svg>
